<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="930" viewBox="0 0 1200 930" role="img" aria-labelledby="t d"><title id="t">CUDA and CUDA++, layer by layer</title><desc id="d">Left: the NVIDIA CUDA stack. Right: CUDA++. The four closed layers above the kernel module are replaced by my own code; the open kernel module is NVIDIA&#x27;s until my own GB10 driver replaces it, and the signed GPU firmware stays NVIDIA&#x27;s.</desc><defs><radialGradient id="glow" cx="22%" cy="-10%" r="85%"><stop offset="0" stop-color="#2d7ff9" stop-opacity="0.16"/><stop offset="0.55" stop-color="#2d7ff9" stop-opacity="0.03"/><stop offset="1" stop-color="#2d7ff9" stop-opacity="0"/></radialGradient><radialGradient id="glow2" cx="92%" cy="8%" r="45%"><stop offset="0" stop-color="#00e599" stop-opacity="0.08"/><stop offset="1" stop-color="#00e599" stop-opacity="0"/></radialGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs><rect x="0.5" y="0.5" width="1199.0" height="929.0" rx="22" fill="#08090c" stroke="#1c2536" stroke-width="1.0"/><rect x="0.5" y="0.5" width="1199.0" height="929.0" rx="22" fill="url(#glow)" stroke="none" stroke-width="1.0"/><text x="48.0" y="60.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="600" fill="#7db4ff" text-anchor="start" letter-spacing="1.5">THE STACK</text><text x="48.0" y="100.0" font-family="Inter, ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#f1f5f9" text-anchor="start" letter-spacing="-0.5">What runs between your program and the GPU</text><text x="48.0" y="150.0" font-family="Inter, ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#94a3b8" text-anchor="start">CUDA</text><text x="664.0" y="150.0" font-family="Inter, ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#00e599" text-anchor="start">CUDA++</text><rect x="48.0" y="172.0" width="488.0" height="72.0" rx="16.0" fill="#0e1219" stroke="#2a3648" stroke-width="1.0"/><text x="70.0" y="204.0" font-family="Inter, ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="650" fill="#f1f5f9" text-anchor="start">Your program</text><text x="70.0" y="228.0" font-family="Inter, ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#94a3b8" text-anchor="start">CUDA C++ kernels and host code</text><rect x="664.0" y="172.0" width="488.0" height="72.0" rx="16.0" fill="#0e1219" stroke="#2a3648" stroke-width="1"/><text x="686.0" y="204.0" font-family="Inter, ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="650" fill="#f1f5f9" text-anchor="start">Your program</text><text x="686.0" y="228.0" font-family="Inter, ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#94a3b8" text-anchor="start">C calls to the kernel builder; Omega&#x27;s languages next (bar C1)</text><rect x="48.0" y="258.0" width="488.0" height="72.0" rx="16.0" fill="#0e1219" stroke="#2a3648" stroke-width="1.0"/><text x="70.0" y="290.0" font-family="Inter, ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="650" fill="#64748b" text-anchor="start" text-decoration="line-through">nvcc · NVVM · PTX · ptxas</text><text x="70.0" y="314.0" font-family="Inter, ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#64748b" text-anchor="start">compiler, closed</text><rect x="664.0" y="258.0" width="488.0" height="72.0" rx="16.0" fill="#0b1a17" stroke="#00e599" stroke-width="1.4"/><text x="686.0" y="290.0" font-family="Int