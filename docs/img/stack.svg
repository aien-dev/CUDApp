ly="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13.5" font-weight="400" fill="#94a3b8" text-anchor="start">nvrm/nvrm.c, m16/: ioctls from the open headers</text><line x1="540.0" y1="552.0" x2="556.6" y2="552.0" stroke="#00e599" stroke-width="1.6" opacity="0.8"/><line x1="643.4" y1="552.0" x2="654.0" y2="552.0" stroke="#00e599" stroke-width="1.6" marker-end="url(#arrow)" opacity="0.8"/><rect x="556.6" y="540.0" width="86.8" height="24.0" rx="12" fill="#08090c" stroke="none" stroke-width="1.0"/><rect x="556.6" y="540.0" width="86.8" height="24.0" rx="12.0" fill="#00e599" stroke="none" stroke-width="1.0" opacity="0.16"/><rect x="556.6" y="540.0" width="86.8" height="24.0" rx="12.0" fill="none" stroke="#00e599" stroke-width="1" opacity="0.7"/><text x="600.0" y="556.7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="600" fill="#00e599" text-anchor="middle">replaced</text><line x1="36.0" y1="610.0" x2="1164.0" y2="610.0" stroke="#64748b" stroke-width="1" stroke-dasharray="6 6"/><rect x="502.0" y="599.0" width="196.0" height="22.0" rx="0.0" fill="#08090c" stroke="none" stroke-width="1.0"/><text x="600.0" y="615.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="400" fill="#94a3b8" text-anchor="middle">user space ↑   kernel ↓</text><rect x="48.0" y="632.0" width="488.0" height="72.0" rx="16.0" fill="#0e1219" stroke="#2d7ff9" stroke-width="1.0"/><text x="70.0" y="664.0" font-family="Inter, ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="650" fill="#f1f5f9" text-anchor="start">nvidia.ko · nvidia-uvm.ko</text><text x="70.0" y="688.0" font-family="Inter, ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#94a3b8" text-anchor="start">NVIDIA&#x27;s open kernel module</text><rect x="664.0" 