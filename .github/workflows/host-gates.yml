# Fresh-checkout host gates (issue #90).
#
# Composition, so this file stays small:
# - make test is already the host-tests job in ci.yml. It is not repeated here.
# - make test-runtime-api is runtime-api.yml. Issue #189 owns that job.
# - An x86-64 host-tests job is issue #196. This file does not add one.
# The AArch64 job below is the documented Linux host path with no GPU device opened.
# Budgets: make -j4, 30 minutes on the arm runner, 5 minutes for the figure check.
name: host-gates
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: host-gates-${{ github.ref }}
  cancel-in-progress: true
jobs:
  figures:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checker negative controls
        run: bash tools/ci/host-gates.sh --self-test
      - name: Figure check
        run: bash tools/ci/host-gates.sh --figures
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: host-gates-figures-${{ github.sha }}
          path: build/host-gates/
          if-no-files-found: warn
  fresh-checkout:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checker negative controls
        run: bash tools/ci/host-gates.sh --self-test
      - name: Host gates
        env:
          HOST_GATES_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash tools/ci/host-gates.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: host-gates-${{ github.sha }}
          path: build/host-gates/
          if-no-files-found: warn
