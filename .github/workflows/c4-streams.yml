# SPDX-License-Identifier: Apache-2.0 WITH LLVM-exception
# C4 streams: build and host/simulator tiers on a GitHub arm64 runner (the Spark builds here while its load is high),
# and the chip binary as an artifact for tools/c4_streams_chip.sh on the GB10. No GPU here: host and simulator only.
name: c4-streams
on:
  pull_request:
    paths: ['src/omega_gpu_cmdlist.*', 'src/omega_gpu_session.*', 'src/omega_gpu_platform_linux.*', 'nvrm/**', 'tests/gpu_streams_test.c', 'tests/gpu_isolation_test.c', 'tests/test_omega_gpu_session_platform.c', 'Makefile', 'mk/**', 'tools/c4_streams_chip.sh', '.github/workflows/c4-streams.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: make -j4 build/gpu_streams_test build/gpu_isolation_test
      - run: ./build/gpu_streams_test --host-only
      - run: ./build/gpu_streams_test --sim
      - run: ./build/gpu_isolation_test --host-only
      - run: sha256sum build/gpu_streams_test | tee build/gpu_streams_test.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: gpu_streams_test-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            build/gpu_streams_test
            build/gpu_streams_test.sha256
